include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Regras do descritivo que viram ERRO, não aviso:
    avoid_print: error # print() vaza em release
    prefer_const_constructors: error # orçamento de desempenho do overlay
    prefer_const_literals_to_create_immutables: error
    use_build_context_synchronously: error # fonte clássica de crash após await
    unawaited_futures: error # future solto engole exceção

    # Ruído que não ajuda neste projeto:
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**
    - ios/**

linter:
  rules:
    # Imutabilidade e previsibilidade
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

    # Clareza
    always_declare_return_types: true
    directives_ordering: true
    sort_constructors_first: true
    unnecessary_lambdas: true
    avoid_redundant_argument_values: true

    # Segurança / correção
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true

    # Documentação de API pública
    slash_for_doc_comments: true
